# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# In AWS, we will inject the DB_HOST, DB_USERNAME, and DB_PASSWORD securely.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dummy_local_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT SECURITY
# ==========================================
# NEVER hardcode the real JWT secret in GitHub!
jwt.secret=${JWT_SECRET:dummy_local_jwt_secret_key_make_it_32_chars_long}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
spring.application.name=ecommerce-backend
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# SWAGGER / API DOCS
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# LOGGING & DEV TOOLS
# ==========================================
logging.level.org.springframework.security=DEBUG
spring.docker.compose.enabled=false

# ==========================================
# GEMINI AI INTEGRATION
# ==========================================
# Inject the API key securely in AWS
gemini.api.key=${GEMINI_API_KEY:dummy_gemini_api_key_for_local_dev}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent